# Coord relay — the zero-knowledge rendezvous for family federation.
#
# Behind your own reverse proxy (Nginx Proxy Manager, Traefik…):
#   docker compose up -d --build
#   → proxy https://coord.tinbadger.com → http://<host>:8790
#
# No reverse proxy on the box? Use the bundled Caddy for automatic HTTPS:
#   RELAY_DOMAIN=coord.tinbadger.com docker compose --profile caddy up -d --build
#
# The relay is RAM-only: no volumes, no logs, sealed blobs only.
services:
  relay:
    build:
      context: ../../apps/relay
    restart: unless-stopped
    ports:
      - "8790:8790"

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RELAY_DOMAIN=${RELAY_DOMAIN:-coord.tinbadger.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data: # TLS certificates only — the relay itself stores nothing
