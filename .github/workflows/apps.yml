# Builds the native shell apps (Windows .exe, macOS .dmg, Linux .deb/.AppImage,
# Android .apk) and attaches them to a GitHub release.
#
# Cut a release:   git tag v0.1.0 && git push --tags
# Manual runs (workflow_dispatch) build everything and stash it as workflow
# artifacts without touching releases.
name: apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux webview deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/shell
          # On a tag push, create/update the release and attach the bundles.
          # On manual runs there's no tag, so we stash workflow artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Coord {0}', github.ref_name) || '' }}
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: coord-desktop-${{ matrix.platform }}
          path: |
            apps/shell/src-tauri/target/release/bundle/**/*.deb
            apps/shell/src-tauri/target/release/bundle/**/*.AppImage
            apps/shell/src-tauri/target/release/bundle/**/*.rpm
            apps/shell/src-tauri/target/release/bundle/**/*.dmg
            apps/shell/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/shell/src-tauri/target/release/bundle/**/*.msi
            apps/shell/src-tauri/target/release/bundle/**/*.exe

  android:
    runs-on: ubuntu-22.04
    # Runs after desktop so the release already exists when we attach the APK.
    needs: desktop
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        working-directory: apps/shell
        run: pnpm exec tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
      - name: Allow plain-http LAN servers (home setups without TLS)
        run: |
          manifest=apps/shell/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$manifest"
          grep -q usesCleartextTraffic "$manifest"
      - name: Build APK (debug-signed — installable by sideloading)
        working-directory: apps/shell
        run: pnpm exec tauri android build --apk --debug
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
      - name: Collect APK
        run: |
          apk=$(find apps/shell/src-tauri/gen/android -name '*.apk' | head -1)
          echo "found: $apk"
          cp "$apk" coord-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: coord-android-apk
          path: coord-android.apk
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" coord-android.apk --clobber --repo "$GITHUB_REPOSITORY"
